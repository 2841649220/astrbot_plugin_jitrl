name: CI

on:
  push:
    branches: [main, "codex/v0.2.0-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest pytest-asyncio pyyaml

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        # The AstrBot integration tests skip themselves when AstrBot is not
        # installed, so the pure algorithm suite still runs on a bare runner.
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test dashboard interactions
        run: node --test tests/test_dashboard.cjs

  neural:
    name: Optional neural CPU runtime (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install pytest pytest-asyncio pyyaml
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test legacy and neural compatibility
        run: python -m pytest -q
      - name: Exercise full-size local training and atomic reload
        run: python scripts/neural_lens.py smoke --steps 20
      - name: Verify installable release archive
        run: python scripts/build_release.py
