# This repository is an AstrBot plugin, not a pip package: AstrBot discovers it
# by importing `main.py` from a directory under `data/plugins/`.
# There is deliberately no build system here. The only thing this file does is
# pin the lint and test configuration so a fresh clone behaves identically on
# every machine and in CI.

[tool.ruff]
line-length = 88
target-version = "py310"
# Scratch directories used by local profiling sessions are never part of the
# plugin and must not influence lint results.
extend-exclude = [".tmp-check", ".tmp-paper", ".tmp-pytest", ".tmp-baseline"]

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "Q",     # flake8-quotes
  "I",     # import-order
  "UP",    # pyupgrade
]
ignore = [
  # The prompt templates and the operator-facing status table are long single
  # string literals: CJK text has no spaces to wrap on and ruff-format never
  # reflows string contents, so the line-length rule cannot be satisfied there.
  "E501",
  "F403",
  "F405",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "strict"
